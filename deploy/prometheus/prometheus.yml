global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flowgrid-api
    metrics_path: /metrics
    static_configs:
      # In Compose, one API container. With several API replicas, list each
      # (or use service discovery); the DB-derived gauges are identical on
      # every replica, so aggregate them with max(), not sum().
      - targets: ["api:8000"]
